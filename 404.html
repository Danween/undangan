<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Tidak Ditemukan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1417; --bone:#EDEAE2; --bone-dim:#A9AFA9; --gold:#BFA046;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--bg); color:var(--bone);
    height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    font-family:'Space Mono', monospace; padding:2rem;
  }
  h1{ font-family:'Fraunces', serif; font-style:italic; font-weight:300; font-size:clamp(2.5rem,8vw,5rem); color:var(--gold); }
  p{ margin-top:1rem; color:var(--bone-dim); font-size:0.85rem; letter-spacing:0.04em; }
  a{ margin-top:2rem; display:inline-block; color:var(--bone); border-bottom:1px solid var(--gold); text-decoration:none; font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase; }
</style>
</head>
<body>
  <h1>404</h1>
  <p>Halaman yang kamu cari tidak ditemukan.</p>
  <a href="/">← Kembali ke undangan</a>
</body>
</html>
